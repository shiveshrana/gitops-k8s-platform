apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neon-runner
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shiveshrana/gitops-k8s-platform.git
    targetRevision: main
    path: k8s/neon-runner
  destination:
    server: https://kubernetes.default.svc
    namespace: neon-runner
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true